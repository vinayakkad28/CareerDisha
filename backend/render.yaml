services:
  - type: web
    name: careerneeti-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: DATABASE_URL
        fromDatabase:
          name: careerneeti-db
          property: connectionString

databases:
  - name: careerneeti-db
    plan: free
    databaseName: careerneeti
