# Render Blueprint.
#
# This file MUST live at the repository root — Render only reads `render.yaml`
# from the root of the repo, so the previous copy at backend/render.yaml was
# never applied. `rootDir` below is what points Render at the backend/ folder.
services:
  - type: web
    name: careerneeti-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # Schema migrations run once per deploy, before any new instance takes
    # traffic. If a migration fails the deploy aborts and the previous version
    # keeps serving. Note: preDeployCommand requires a paid instance type — on
    # the free tier, delete this line and prepend `alembic upgrade head &&` to
    # the Dockerfile CMD instead.
    preDeployCommand: alembic upgrade head

    envVars:
      # --- Required ---
      - key: ENVIRONMENT
        value: production          # makes the app refuse to boot without secrets
      - key: DATABASE_URL
        fromDatabase:
          name: careerneeti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false                # set in the Render dashboard

      # --- LLM. GROQ is the default provider; report generation is dead without it. ---
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "90"

      # --- Frontend origin. Update to the real Vercel domain. ---
      - key: CORS_ORIGINS
        value: https://careerneeti.in,https://www.careerneeti.in

      # --- Payments: off until Razorpay credentials exist. ---
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # --- Optional integrations. Unset = feature is a no-op, not an error. ---
      - key: APP_BASE_URL
        value: https://careerneeti.in
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      - key: OUTPUT_DIR
        value: /tmp/output

databases:
  - name: careerneeti-db
    # WARNING: Render deletes free-tier Postgres instances after 30 days.
    # Move to a paid plan before storing real student data.
    plan: free
    databaseName: careerneeti
