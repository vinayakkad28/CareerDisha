# Render Blueprint.
#
# NOTE: deploying this via New -> Blueprint requires a payment method on file,
# even though every service here is on the free plan ("Your Blueprint services
# require payment information on file"). To deploy free, create the web service
# manually in the dashboard instead and set the env vars below by hand — see
# DEPLOY.md section 2. This file is kept as the authoritative record of the
# intended configuration, and works as-is once you are on a paid plan.
#
# It must live at the repository root — Render only reads `render.yaml` from
# there, so the previous copy at backend/render.yaml was never applied.
# `rootDir` below is what points Render at the backend/ folder.
services:
  - type: web
    name: careerneeti-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Without an explicit plan, Render defaults to a PAID instance type and the
    # Blueprint asks for a card before it will deploy.
    plan: free

    # NOTE: migrations deliberately do NOT use preDeployCommand, which requires a
    # paid instance. The Dockerfile's CMD runs `alembic upgrade head` before
    # uvicorn instead, so the free plan works unchanged. The tradeoff is that a
    # failed migration crash-loops the container rather than aborting the deploy
    # cleanly — acceptable here, and the startup schema check makes the reason
    # obvious in the logs.

    envVars:
      # --- Required ---
      - key: ENVIRONMENT
        value: production          # makes the app refuse to boot without secrets
      # Set manually to an external Postgres connection string.
      #
      # NOT wired to a Render database on purpose: Render's free Postgres is
      # DELETED 30 days after creation, and this project has already lost its
      # database once. Neon's free tier does not delete data — it scales the
      # compute to zero after 5 minutes idle and wakes on the next connection,
      # which is transparent to the app.
      #
      # Use the POOLED connection string and keep sslmode=require, e.g.
      #   postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false                # set in the Render dashboard

      # --- LLM. GROQ is the default provider; report generation is dead without it. ---
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "90"

      # --- Frontend origin. Update to the real Vercel domain. ---
      - key: CORS_ORIGINS
        value: https://careerneeti.in,https://www.careerneeti.in

      # --- Payments: off until Razorpay credentials exist. ---
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # --- Optional integrations. Unset = feature is a no-op, not an error. ---
      - key: APP_BASE_URL
        value: https://careerneeti.in
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      - key: OUTPUT_DIR
        value: /tmp/output

# No `databases:` block. Render's free Postgres is deleted after 30 days, which
# is a data-loss event, not a downgrade. The database lives on Neon's free tier
# instead and is supplied through DATABASE_URL above. If you later move to a
# paid Render database, add the block back and switch DATABASE_URL to
# `fromDatabase`.
