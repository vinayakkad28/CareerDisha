name: CareerDisha CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Migrations are verified against real Postgres, not SQLite. The schema drift
    # that broke this project (6 of 11 tables absent from the migration chain,
    # 12 columns missing from every deployed database) was invisible locally
    # because startup called create_all(), which bypasses Alembic entirely.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerneeti_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Migrations build the schema from empty
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerneeti_ci
        run: alembic upgrade head

      - name: Migrations match models.py (no drift)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerneeti_ci
        run: alembic check

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify app imports
        run: python -c "from main import app; print('Backend imports OK')"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned deliberately. `npm install -g pnpm` installed whatever was latest,
      # and a newer pnpm turned ERR_PNPM_IGNORED_BUILDS from a warning into a
      # hard failure — breaking CI on a commit that touched no frontend deps.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
